[project]
name = "bank-budget"
version = "0.1.0"
description = "Reproducible bank-statement line to budget-category model (Apertus 1.5B Instruct + LoRA) with Apple MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.0",
    # MLX only ships Apple Silicon wheels. On other platforms the package still
    # installs so the offline unit tests can run (training/inference are disabled).
    "mlx-lm>=0.32.2,<0.33 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    # The shop-based split is defined with pandas (groupby / sample).
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
bank-budget = "bank_budget.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_budget"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["bank_budget"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "macos: needs Apple Silicon + MLX (skipped elsewhere)",
]
